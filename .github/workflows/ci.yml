name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node reads packageManager and would look for pnpm before
          # corepack has installed it. Four dependencies is not worth a cache.
          package-manager-cache: false

      # package.json pins the pnpm version; corepack installs exactly that one.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # tsc over src+test and over api+middleware, then the node:test suite.
      - run: pnpm run check

      # The command Vercel runs, so a deploy cannot break in a way CI missed.
      - run: pnpm run build:hosted

  postgres:
    name: PostgreSQL ledger integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: overview
          POSTGRES_PASSWORD: overview_test
          POSTGRES_DB: overview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overview -d overview_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OVERVIEW_TEST_DATABASE_URL: postgresql://overview:overview_test@127.0.0.1:5432/overview_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm run test:postgres
